<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 AI Edition | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.5rem;font-weight:700;margin-bottom:4px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.score-box{background:#f5f3ff;border-radius:12px;padding:10px 18px;text-align:center}
.score-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.score-val{font-size:1.3rem;font-weight:700;color:#6366f1}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#e0e7ff;padding:10px;border-radius:16px;margin-bottom:14px;touch-action:none}
.cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(14px,4vw,22px);transition:all .1s;background:#f5f3ff;color:#4f46e5}
.c2{background:#e0e7ff;color:#4f46e5}
.c4{background:#c7d2fe;color:#3730a3}
.c8{background:#a5b4fc;color:#fff}
.c16{background:#818cf8;color:#fff}
.c32{background:#6366f1;color:#fff}
.c64{background:#4f46e5;color:#fff}
.c128{background:#ec4899;color:#fff;font-size:clamp(12px,3.5vw,18px)}
.c256{background:#db2777;color:#fff;font-size:clamp(12px,3.5vw,18px)}
.c512{background:#be185d;color:#fff;font-size:clamp(11px,3vw,16px)}
.c1024{background:#9d174d;color:#fff;font-size:clamp(10px,2.8vw,14px)}
.c2048{background:#fbbf24;color:#fff;font-size:clamp(10px,2.8vw,14px)}
button{padding:11px 20px;border:none;border-radius:12px;background:linear-gradient(90deg,#6366f1,#a78bfa);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.3s}
button:hover{transform:translateY(-2px);opacity:.9}
.hint{font-size:12px;color:#94a3b8;margin-top:8px}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <h1>🧩 2048 AI Edition</h1>
    <div style="display:flex;gap:8px">
      <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="score">0</div></div>
      <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="best">0</div></div>
    </div>
  </div>
  <div id="board"></div>
  <button onclick="newGame()">New Game</button>
  <p class="hint">Arrow keys or swipe to move tiles</p>
</div>
<a href="../games.html" class="back">← Back to Games</a>

<script>
let grid, score, best=0;

function newGame(){
  grid=Array(4).fill(null).map(()=>Array(4).fill(0));
  score=0;
  addTile();addTile();
  render();
}

function addTile(){
  const empty=[];
  grid.forEach((row,r)=>row.forEach((v,c)=>{if(!v)empty.push([r,c])}));
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<.9?2:4;
}

function render(){
  document.getElementById('score').textContent=score;
  if(score>best){best=score;document.getElementById('best').textContent=best;}
  const b=document.getElementById('board');
  b.innerHTML=grid.map(row=>row.map(v=>`<div class="cell${v?' c'+v:''}">${v||''}</div>`).join('')).join('');
}

function slide(row){
  let arr=row.filter(v=>v);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr.splice(i+1,1);}
  }
  while(arr.length<4)arr.push(0);
  return arr;
}

function move(dir){
  let moved=false;
  const old=JSON.stringify(grid);
  if(dir==='left') grid=grid.map(r=>slide(r));
  if(dir==='right') grid=grid.map(r=>slide([...r].reverse()).reverse());
  if(dir==='up'||dir==='down'){
    for(let c=0;c<4;c++){
      let col=grid.map(r=>r[c]);
      if(dir==='down')col.reverse();
      col=slide(col);
      if(dir==='down')col.reverse();
      grid.forEach((r,i)=>r[c]=col[i]);
    }
  }
  if(JSON.stringify(grid)!==old){addTile();render();}
}

document.addEventListener('keydown',e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});

let tx,ty;
document.getElementById('board').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.getElementById('board').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  const dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){move(dx>0?'right':'left');}
  else{move(dy>0?'down':'up');}
});

newGame();
</script>
</body>
</html>

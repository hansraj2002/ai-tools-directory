<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Neo | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.5rem;font-weight:700;margin-bottom:12px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.scores{display:flex;justify-content:center;gap:16px;margin-bottom:14px}
.sc{background:#f5f3ff;border-radius:10px;padding:8px 16px}
.sc-val{font-size:1.2rem;font-weight:700;color:#6366f1}
.sc-label{font-size:11px;color:#64748b}
canvas{border-radius:16px;display:block;margin:0 auto 14px;max-width:100%;background:#0f172a}
.controls{display:grid;grid-template-columns:repeat(3,48px);gap:6px;justify-content:center;margin:12px auto}
.ctrl-btn{width:48px;height:48px;border:none;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:1.2rem;cursor:pointer}
.hint{font-size:12px;color:#94a3b8;margin-bottom:10px}
button.main{padding:10px 24px;border:none;border-radius:12px;background:linear-gradient(90deg,#6366f1,#a78bfa);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.3s}
button.main:hover{transform:translateY(-2px);opacity:.9}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
</style>
</head>
<body>
<div class="card">
  <h1>🐍 Snake Neo</h1>
  <div class="scores">
    <div class="sc"><div class="sc-val" id="score">0</div><div class="sc-label">Score</div></div>
    <div class="sc"><div class="sc-val" id="best">0</div><div class="sc-label">Best</div></div>
  </div>
  <canvas id="c" width="320" height="320"></canvas>
  <p class="hint">Arrow keys or buttons below • Tap to start</p>
  <div class="controls">
    <div></div><button class="ctrl-btn" onclick="setDir(0,-1)">▲</button><div></div>
    <button class="ctrl-btn" onclick="setDir(-1,0)">◀</button>
    <button class="ctrl-btn" onclick="setDir(0,1)">▼</button>
    <button class="ctrl-btn" onclick="setDir(1,0)">▶</button>
  </div>
  <button class="main" onclick="startGame()">Start / Restart</button>
</div>
<a href="../games.html" class="back">← Back to Games</a>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SZ=20,COLS=16,ROWS=16;
let snake,dir,food,score,best=0,interval,running=false;

function startGame(){
  clearInterval(interval);
  snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];
  dir={x:1,y:0};
  score=0;running=true;
  placeFood();
  interval=setInterval(tick,130);
}

function placeFood(){
  do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function setDir(x,y){if(!running)startGame();if(x===0&&dir.x===0)return;if(y===0&&dir.y===0)return;dir={x,y};}

function tick(){
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
    clearInterval(interval);running=false;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';
    ctx.fillText('Game Over! Score: '+score,cv.width/2,cv.height/2);
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score+=10;if(score>best)best=score;document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;placeFood();}
  else snake.pop();
  draw();
}

function draw(){
  ctx.fillStyle='#0f172a';ctx.fillRect(0,0,cv.width,cv.height);
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?'#a78bfa':'#6366f1';
    ctx.beginPath();ctx.roundRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2,4);ctx.fill();
  });
  ctx.fillStyle='#f472b6';
  ctx.beginPath();ctx.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2-2,0,Math.PI*2);ctx.fill();
}

document.addEventListener('keydown',e=>{
  const map={ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1}};
  if(map[e.key]){e.preventDefault();const d=map[e.key];if(d.x!=-dir.x||d.y!=-dir.y)dir=d;}
});

// Initial screen
ctx.fillStyle='#0f172a';ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#a78bfa';ctx.font='bold 18px system-ui';ctx.textAlign='center';
ctx.fillText('Press Start to Play',cv.width/2,cv.height/2);
</script>
</body>
</html>

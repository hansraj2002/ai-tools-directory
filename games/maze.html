<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Maze Runner | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:24px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.5rem;font-weight:700;margin-bottom:12px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
canvas{border-radius:12px;display:block;margin:0 auto 12px;max-width:100%}
.controls{display:grid;grid-template-columns:repeat(3,48px);gap:6px;justify-content:center;margin:8px auto 12px}
.ctrl-btn{width:48px;height:48px;border:none;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:1.2rem;cursor:pointer;font-family:inherit}
.stats{display:flex;justify-content:center;gap:14px;margin-bottom:12px}
.st{background:#f5f3ff;border-radius:10px;padding:7px 14px}
.st-val{font-size:1.1rem;font-weight:700;color:#6366f1}
.st-label{font-size:11px;color:#64748b}
.hint{font-size:12px;color:#94a3b8;margin-bottom:10px}
button.main{padding:10px 24px;border:none;border-radius:12px;background:linear-gradient(90deg,#6366f1,#a78bfa);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.3s}
button.main:hover{transform:translateY(-2px);opacity:.9}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
</style>
</head>
<body>
<div class="card">
  <h1>🌀 AI Maze Runner</h1>
  <div class="stats">
    <div class="st"><div class="st-val" id="moves">0</div><div class="st-label">Moves</div></div>
    <div class="st"><div class="st-val" id="timer">0s</div><div class="st-label">Time</div></div>
    <div class="st"><div class="st-val" id="level">1</div><div class="st-label">Level</div></div>
  </div>
  <canvas id="c"></canvas>
  <p class="hint">Arrow keys or buttons to move • Reach the 🏁</p>
  <div class="controls">
    <div></div><button class="ctrl-btn" onclick="move(0,-1)">▲</button><div></div>
    <button class="ctrl-btn" onclick="move(-1,0)">◀</button>
    <button class="ctrl-btn" onclick="move(0,1)">▼</button>
    <button class="ctrl-btn" onclick="move(1,0)">▶</button>
  </div>
  <button class="main" onclick="newGame()">New Maze</button>
</div>
<a href="../games.html" class="back">← Back to Games</a>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SIZE=15,CELL=24;
cv.width=cv.height=SIZE*CELL;
let maze,player,moves,seconds,timerInt,level=1;

function newGame(){
  clearInterval(timerInt);moves=0;seconds=0;
  document.getElementById('moves').textContent='0';
  document.getElementById('timer').textContent='0s';
  document.getElementById('level').textContent=level;
  maze=generateMaze(SIZE,SIZE);
  player={x:0,y:0};
  timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent=seconds+'s';},1000);
  draw();
}

function generateMaze(w,h){
  const m=Array(h).fill(null).map(()=>Array(w).fill(1));
  function carve(x,y){
    m[y][x]=0;
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-.5);
    for(const[dx,dy]of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<w&&ny>=0&&ny<h&&m[ny][nx]===1){m[y+dy/2][x+dx/2]=0;carve(nx,ny);}
    }
  }
  carve(0,0);
  m[h-1][w-1]=0;
  return m;
}

function draw(){
  ctx.fillStyle='#1e293b';ctx.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
    if(maze[y][x]===1){ctx.fillStyle='#6366f1';ctx.fillRect(x*CELL,y*CELL,CELL,CELL);}
    else{ctx.fillStyle='#f8fafc';ctx.fillRect(x*CELL,y*CELL,CELL,CELL);}
  }
  // Goal
  ctx.font=`${CELL-4}px serif`;ctx.textAlign='center';
  ctx.fillText('🏁',(SIZE-1)*CELL+CELL/2,(SIZE-1)*CELL+CELL-2);
  // Player
  ctx.fillStyle='#ec4899';
  ctx.beginPath();ctx.arc(player.x*CELL+CELL/2,player.y*CELL+CELL/2,CELL/2-3,0,Math.PI*2);ctx.fill();
}

function move(dx,dy){
  const nx=player.x+dx,ny=player.y+dy;
  if(nx<0||nx>=SIZE||ny<0||ny>=SIZE||maze[ny][nx]===1)return;
  player={x:nx,y:ny};moves++;
  document.getElementById('moves').textContent=moves;
  draw();
  if(nx===SIZE-1&&ny===SIZE-1){
    clearInterval(timerInt);
    setTimeout(()=>{
      alert(`🎉 Maze complete!\nMoves: ${moves} | Time: ${seconds}s`);
      level++;newGame();
    },100);
  }
}

document.addEventListener('keydown',e=>{
  const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(map[e.key]){e.preventDefault();move(...map[e.key]);}
});

newGame();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Speed Challenge | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:32px;max-width:600px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:6px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;font-size:14px;color:#64748b;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:#f5f3ff;border-radius:14px;padding:14px;text-align:center}
.stat-val{font-size:1.5rem;font-weight:700;color:#6366f1}
.stat-label{font-size:11px;color:#64748b;margin-top:2px}
.word-display{background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:20px;font-size:1.3rem;font-weight:600;text-align:center;margin-bottom:14px;min-height:64px;line-height:1.5;color:#1e293b;letter-spacing:.5px}
.word-display .correct{color:#22c55e}
.word-display .wrong{color:#ef4444}
.word-display .current{background:#e0e7ff;border-radius:4px;padding:0 2px}
textarea{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:14px;font-size:1rem;resize:none;outline:none;font-family:inherit;transition:.3s;height:60px}
textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.2)}
button{width:100%;padding:13px;border:none;border-radius:14px;background:linear-gradient(90deg,#6366f1,#a78bfa);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:.3s;margin-top:10px}
button:hover{transform:translateY(-2px);opacity:.9}
.timer{text-align:center;font-size:2rem;font-weight:700;color:#6366f1;margin-bottom:10px}
.result{text-align:center;padding:16px;background:#dcfce7;border-radius:14px;margin-top:14px;display:none}
.result h3{color:#16a34a;font-size:1.2rem;margin-bottom:8px}
.result p{color:#15803d;font-size:14px}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85;text-align:center;width:100%}
</style>
</head>
<body>
<div class="card">
  <h1>⌨️ Word Speed Challenge</h1>
  <p class="subtitle">Type the words as fast and accurately as you can — 60 seconds</p>
  <div class="timer" id="timer">60</div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="wpm">0</div><div class="stat-label">WPM</div></div>
    <div class="stat"><div class="stat-val" id="accuracy">100%</div><div class="stat-label">Accuracy</div></div>
    <div class="stat"><div class="stat-val" id="correct">0</div><div class="stat-label">Correct</div></div>
  </div>
  <div class="word-display" id="word-display"></div>
  <textarea id="input" placeholder="Click here and start typing..." oninput="handleInput()" disabled></textarea>
  <button onclick="startGame()" id="startBtn">Start Game</button>
  <div class="result" id="result"></div>
</div>
<a href="../games.html" class="back">← Back to Games</a>

<script>
const words = ['the','be','to','of','and','a','in','that','have','it','for','not','on','with','he','as','you','do','at','this','but','his','by','from','they','we','say','her','she','or','an','will','my','one','all','would','there','their','what','so','up','out','if','about','who','get','which','go','me','when','make','can','like','time','no','just','him','know','take','people','into','year','your','good','some','could','them','see','other','than','then','now','look','only','come','its','over','think','also','back','after','use','two','how','our','work','first','well','way','even','new','want','because','any','these','give','day','most','us'];

let timer, timeLeft=60, started=false, wordList=[], wordIndex=0, charIndex=0, correct=0, total=0, interval;

function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

function buildWordList(){ wordList = []; for(let i=0;i<80;i++) wordList.push(words[Math.floor(Math.random()*words.length)]); }

function renderWords(){
  const el = document.getElementById('word-display');
  el.innerHTML = wordList.slice(0, 30).map((w,i)=>{
    if(i < wordIndex) return `<span class="correct">${w} </span>`;
    if(i === wordIndex) return `<span class="current">${w}</span> `;
    return `<span>${w} </span>`;
  }).join('');
}

function startGame(){
  buildWordList();
  wordIndex=0; charIndex=0; correct=0; total=0; timeLeft=60; started=true;
  document.getElementById('input').value='';
  document.getElementById('input').disabled=false;
  document.getElementById('input').focus();
  document.getElementById('startBtn').textContent='Restart';
  document.getElementById('result').style.display='none';
  document.getElementById('wpm').textContent='0';
  document.getElementById('accuracy').textContent='100%';
  document.getElementById('correct').textContent='0';
  document.getElementById('timer').textContent='60';
  renderWords();
  clearInterval(interval);
  interval = setInterval(()=>{
    timeLeft--;
    document.getElementById('timer').textContent=timeLeft;
    const wpm = Math.round((correct/(60-timeLeft+1))*60) || 0;
    document.getElementById('wpm').textContent=wpm;
    if(timeLeft<=0){ clearInterval(interval); endGame(); }
  },1000);
}

function handleInput(){
  if(!started||timeLeft<=0) return;
  const typed = document.getElementById('input').value;
  if(typed.endsWith(' ')){
    const word = typed.trim();
    total++;
    if(word === wordList[wordIndex]) correct++;
    document.getElementById('correct').textContent=correct;
    document.getElementById('accuracy').textContent=total>0?Math.round((correct/total)*100)+'%':'100%';
    wordIndex++;
    document.getElementById('input').value='';
    renderWords();
  }
}

function endGame(){
  started=false;
  document.getElementById('input').disabled=true;
  const wpm=Math.round((correct/60)*60);
  const acc=total>0?Math.round((correct/total)*100):0;
  const el=document.getElementById('result');
  el.style.display='block';
  el.innerHTML=`<h3>⏱️ Time's up!</h3><p>Final WPM: <strong>${wpm}</strong> &nbsp;|&nbsp; Accuracy: <strong>${acc}%</strong> &nbsp;|&nbsp; Words typed: <strong>${total}</strong></p>`;
}
</script>
</body>
</html>

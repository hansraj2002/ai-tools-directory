<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:24px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.5rem;font-weight:700;margin-bottom:12px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.scores{display:flex;justify-content:center;gap:16px;margin-bottom:12px}
.sc{background:#f5f3ff;border-radius:10px;padding:8px 16px}
.sc-val{font-size:1.2rem;font-weight:700;color:#6366f1}
.sc-label{font-size:11px;color:#64748b}
canvas{border-radius:16px;display:block;margin:0 auto;max-width:100%}
.hint{font-size:13px;color:#94a3b8;margin-top:10px}
.ctrl{display:flex;justify-content:center;gap:10px;margin-top:10px}
.ctrl button{width:56px;height:48px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-size:1.3rem;cursor:pointer}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
</style>
</head>
<body>
<div class="card">
  <h1>🛣️ Drive</h1>
  <div class="scores">
    <div class="sc"><div class="sc-val" id="score">0</div><div class="sc-label">Distance</div></div>
    <div class="sc"><div class="sc-val" id="best">0</div><div class="sc-label">Best</div></div>
  </div>
  <canvas id="c" width="340" height="420"></canvas>
  <p class="hint">← → Arrow keys or buttons to change lanes</p>
  <div class="ctrl">
    <button onpointerdown="moveLeft()">◀</button>
    <button onpointerdown="moveRight()">▶</button>
  </div>
</div>
<a href="../games.html" class="back">← Back to Games</a>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=340,H=420,LANES=[70,140,210,280];
let player,obstacles,score,best=0,speed,frame,raf,running=false,dead=false,roadY=0;

function init(){
  player={lane:1,x:LANES[1]-20,y:H-110,w:40,h:70};
  obstacles=[];score=0;speed=3.5;frame=0;dead=false;running=false;
  cancelAnimationFrame(raf);drawIdle();
}

function start(){running=true;loop();}
function moveLeft(){if(!running&&!dead){start();return;}if(player.lane>0)player.lane--;}
function moveRight(){if(!running&&!dead){start();return;}if(player.lane<3)player.lane++;}

function loop(){
  frame++;roadY=(roadY+speed)%60;
  if(frame%Math.max(30,50-Math.floor(score/30))===0){
    const lane=Math.floor(Math.random()*4);
    const used=obstacles.filter(o=>o.y<-20).map(o=>o.lane);
    obstacles.push({lane,x:LANES[lane]-20,y:-80,w:40,h:70,color:`hsl(${Math.random()*360},65%,50%)`});
  }
  obstacles.forEach(o=>o.y+=speed);
  obstacles=obstacles.filter(o=>o.y<H+90);
  player.x+=(LANES[player.lane]-20-player.x)*0.2;
  for(const o of obstacles){
    if(player.x+5<o.x+o.w-5&&player.x+player.w-5>o.x+5&&player.y+5<o.y+o.h-5&&player.y+player.h-5>o.y+5){
      dead=true;running=false;
      if(score>best){best=score;document.getElementById('best').textContent=best;}
      draw();
      ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';
      ctx.fillText('💥 Crash! Distance: '+score,W/2,H/2-10);
      ctx.font='13px system-ui';ctx.fillText('Tap to restart',W/2,H/2+20);
      return;
    }
  }
  score++;if(score%60===0)speed=Math.min(11,speed+0.3);
  document.getElementById('score').textContent=score;
  draw();raf=requestAnimationFrame(loop);
}

function draw(){
  // Road
  ctx.fillStyle='#374151';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1f2937';ctx.fillRect(50,0,W-100,H);
  // Lane markings
  ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;ctx.setLineDash([30,20]);
  [105,175,245].forEach(x=>{
    for(let y=-60+roadY;y<H;y+=60){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+35);ctx.stroke();}
  });
  ctx.setLineDash([]);
  // Obstacles
  obstacles.forEach(o=>{
    ctx.fillStyle=o.color;ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,8);ctx.fill();
    ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🚙',o.x+o.w/2,o.y+o.h-6);
  });
  // Player
  ctx.fillStyle='#6366f1';ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h,8);ctx.fill();
  ctx.font='28px serif';ctx.textAlign='center';ctx.fillText('🚗',player.x+player.w/2,player.y+player.h-6);
}

function drawIdle(){
  ctx.fillStyle='#374151';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1f2937';ctx.fillRect(50,0,W-100,H);
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 18px system-ui';ctx.textAlign='center';
  ctx.fillText('🛣️ Drive',W/2,H/2-20);
  ctx.font='13px system-ui';ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.fillText('Tap or arrow keys to start',W/2,H/2+15);
}

document.addEventListener('keydown',e=>{
  if(!running&&!dead){start();return;}
  if(dead){init();return;}
  if(e.key==='ArrowLeft'){e.preventDefault();moveLeft();}
  if(e.key==='ArrowRight'){e.preventDefault();moveRight();}
});
cv.addEventListener('click',()=>{if(!running&&!dead)start();else if(dead)init();});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(!running&&!dead)start();else if(dead)init();},{passive:false});
init();
</script>
</body>
</html>

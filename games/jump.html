<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jump Cube | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:24px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.5rem;font-weight:700;margin-bottom:12px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.scores{display:flex;justify-content:center;gap:16px;margin-bottom:12px}
.sc{background:#f5f3ff;border-radius:10px;padding:8px 16px}
.sc-val{font-size:1.2rem;font-weight:700;color:#6366f1}
.sc-label{font-size:11px;color:#64748b}
canvas{border-radius:16px;display:block;margin:0 auto;max-width:100%;cursor:pointer}
.hint{font-size:13px;color:#94a3b8;margin-top:10px}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
</style>
</head>
<body>
<div class="card">
  <h1>🟦 Jump Cube</h1>
  <div class="scores">
    <div class="sc"><div class="sc-val" id="score">0</div><div class="sc-label">Score</div></div>
    <div class="sc"><div class="sc-val" id="best">0</div><div class="sc-label">Best</div></div>
  </div>
  <canvas id="c" width="440" height="180"></canvas>
  <p class="hint">Press Space, click, or tap to jump</p>
</div>
<a href="../games.html" class="back">← Back to Games</a>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const GH=160,GROUND=GH-30;
let player,obstacles,score,best=0,speed,frame,raf,started=false,dead=false;

function init(){
  player={x:60,y:GROUND,w:28,h:28,vy:0,onGround:true};
  obstacles=[];score=0;speed=4;frame=0;dead=false;started=false;
  document.getElementById('score').textContent='0';
  cancelAnimationFrame(raf);
  drawIdle();
}

function jump(){
  if(!started){started=true;loop();return;}
  if(dead){init();return;}
  if(player.onGround){player.vy=-11;player.onGround=false;}
}

function loop(){
  frame++;
  // Spawn obstacles
  if(frame%(Math.max(60,90-Math.floor(score/5)))===0){
    const h=30+Math.random()*30;
    obstacles.push({x:cv.width,y:GROUND+28-h,w:22,h});
  }
  // Physics
  player.vy+=0.55;player.y+=player.vy;
  if(player.y>=GROUND){player.y=GROUND;player.vy=0;player.onGround=true;}
  // Move obstacles
  obstacles.forEach(o=>o.x-=speed);
  obstacles=obstacles.filter(o=>o.x+o.w>0);
  // Collision
  for(const o of obstacles){
    if(player.x+player.w-4>o.x&&player.x+4<o.x+o.w&&player.y+player.h-4>o.y&&player.y+4<o.y+o.h){
      dead=true;if(score>best){best=score;document.getElementById('best').textContent=best;}
      drawDead();return;
    }
  }
  score++;if(score%10===0)speed=Math.min(10,speed+0.2);
  document.getElementById('score').textContent=score;
  if(score%50===0)speed+=0.3;
  draw();
  raf=requestAnimationFrame(loop);
}

function draw(){
  ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,cv.width,cv.height);
  // Ground
  ctx.fillStyle='#e0e7ff';ctx.fillRect(0,GROUND+28,cv.width,cv.height);
  ctx.strokeStyle='#a78bfa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,GROUND+28);ctx.lineTo(cv.width,GROUND+28);ctx.stroke();
  // Player
  const p=player;
  ctx.fillStyle='#6366f1';ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,6);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('🟦',p.x+p.w/2,p.y+p.h-4);
  // Obstacles
  obstacles.forEach(o=>{
    ctx.fillStyle='#ec4899';ctx.beginPath();ctx.roundRect(o.x,o.y,o.w,o.h,4);ctx.fill();
  });
}

function drawIdle(){
  ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#e0e7ff';ctx.fillRect(0,GROUND+28,cv.width,cv.height);
  ctx.fillStyle='#6366f1';ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h,6);ctx.fill();
  ctx.fillStyle='#6366f1';ctx.font='bold 18px system-ui';ctx.textAlign='center';
  ctx.fillText('Tap or press Space to start',cv.width/2,GH/2-10);
}

function drawDead(){
  draw();
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';
  ctx.fillText(`Game Over! Score: ${score}`,cv.width/2,GH/2-10);
  ctx.font='14px system-ui';ctx.fillText('Tap or Space to restart',cv.width/2,GH/2+20);
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});
cv.addEventListener('click',jump);
cv.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
init();
</script>
</body>
</html>

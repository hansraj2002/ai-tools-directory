<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helicopter 2 | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:24px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.5rem;font-weight:700;margin-bottom:12px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.scores{display:flex;justify-content:center;gap:16px;margin-bottom:12px}
.sc{background:#f5f3ff;border-radius:10px;padding:8px 16px}
.sc-val{font-size:1.2rem;font-weight:700;color:#6366f1}
.sc-label{font-size:11px;color:#64748b}
canvas{border-radius:16px;display:block;margin:0 auto;max-width:100%;cursor:pointer}
.hint{font-size:13px;color:#94a3b8;margin-top:10px}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
</style>
</head>
<body>
<div class="card">
  <h1>🚁 Helicopter 2</h1>
  <div class="scores">
    <div class="sc"><div class="sc-val" id="score">0</div><div class="sc-label">Score</div></div>
    <div class="sc"><div class="sc-val" id="best">0</div><div class="sc-label">Best</div></div>
  </div>
  <canvas id="c" width="440" height="220"></canvas>
  <p class="hint">Hold Space / click / tap to fly up — release to drop</p>
</div>
<a href="../games.html" class="back">← Back to Games</a>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=440,H=220;
let heli,pipes,score,best=0,frame,raf,running=false,dead=false,lift=false;

function init(){
  heli={x:80,y:H/2,vy:0,w:44,h:24};
  pipes=[];score=0;frame=0;dead=false;running=false;
  cancelAnimationFrame(raf);drawIdle();
}

function start(){running=true;loop();}

function loop(){
  frame++;
  // Spawn pipes
  if(frame%90===0){
    const gap=70,topH=30+Math.random()*(H-gap-60);
    pipes.push({x:W,topH,gap,scored:false});
  }
  // Physics
  heli.vy+=lift?-0.45:0.5;
  heli.vy=Math.max(-6,Math.min(6,heli.vy));
  heli.y+=heli.vy;
  // Move pipes
  pipes.forEach(p=>p.x-=2.8);
  pipes=pipes.filter(p=>p.x+40>0);
  // Score
  pipes.forEach(p=>{if(!p.scored&&p.x+40<heli.x){p.scored=true;score++;document.getElementById('score').textContent=score;}});
  // Collision — walls
  if(heli.y<0||heli.y+heli.h>H){crash();return;}
  // Collision — pipes
  for(const p of pipes){
    if(heli.x+heli.w-6>p.x&&heli.x+6<p.x+40){
      if(heli.y+4<p.topH||heli.y+heli.h-4>p.topH+p.gap){crash();return;}
    }
  }
  draw();raf=requestAnimationFrame(loop);
}

function crash(){
  dead=true;running=false;
  if(score>best){best=score;document.getElementById('best').textContent=best;}
  draw();
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.textAlign='center';
  ctx.fillText('💥 Crashed! Score: '+score,W/2,H/2-10);
  ctx.font='13px system-ui';ctx.fillText('Tap to restart',W/2,H/2+20);
}

function draw(){
  ctx.fillStyle='#e0f2fe';ctx.fillRect(0,0,W,H);
  // Pipes
  pipes.forEach(p=>{
    ctx.fillStyle='#4ade80';
    ctx.fillRect(p.x,0,40,p.topH);
    ctx.fillRect(p.x,p.topH+p.gap,40,H-p.topH-p.gap);
    ctx.fillStyle='#22c55e';
    ctx.fillRect(p.x-4,p.topH-14,48,14);
    ctx.fillRect(p.x-4,p.topH+p.gap,48,14);
  });
  // Heli
  ctx.font='32px serif';ctx.textAlign='center';
  ctx.fillText('🚁',heli.x+heli.w/2,heli.y+heli.h);
  // Score
  ctx.fillStyle='#1e293b';ctx.font='bold 14px system-ui';ctx.textAlign='left';
  ctx.fillText('Score: '+score,10,22);
}

function drawIdle(){
  ctx.fillStyle='#e0f2fe';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1e293b';ctx.font='bold 17px system-ui';ctx.textAlign='center';
  ctx.fillText('🚁 Helicopter 2',W/2,H/2-20);
  ctx.font='13px system-ui';ctx.fillStyle='#475569';
  ctx.fillText('Hold space / tap to fly — release to drop',W/2,H/2+15);
}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();lift=true;if(!running&&!dead)start();else if(dead)init();}});
document.addEventListener('keyup',e=>{if(e.code==='Space')lift=false;});
cv.addEventListener('pointerdown',e=>{e.preventDefault();lift=true;if(!running&&!dead)start();else if(dead)init();});
cv.addEventListener('pointerup',()=>lift=false);
init();
</script>
</body>
</html>

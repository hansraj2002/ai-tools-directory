<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Time Test | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:32px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.6rem;font-weight:700;margin-bottom:6px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:14px;color:#64748b;margin-bottom:24px}
#arena{width:100%;height:220px;border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.2rem;font-weight:600;transition:background .2s;user-select:none;margin-bottom:20px;border:3px solid #e2e8f0}
#arena.wait{background:#fef3c7;color:#92400e;border-color:#fcd34d}
#arena.ready{background:#dcfce7;color:#15803d;border-color:#4ade80;animation:pulse .5s infinite alternate}
#arena.clicked-early{background:#fee2e2;color:#dc2626;border-color:#f87171}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.02)}}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.res-box{background:#f5f3ff;border-radius:12px;padding:12px}
.res-val{font-size:1.4rem;font-weight:700;color:#6366f1}
.res-label{font-size:11px;color:#64748b;margin-top:2px}
.history{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;min-height:32px}
.hist-chip{background:#e0e7ff;color:#4f46e5;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px}
button{width:100%;padding:12px;border:none;border-radius:14px;background:linear-gradient(90deg,#6366f1,#a78bfa);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:.3s}
button:hover{transform:translateY(-2px);opacity:.9}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
</style>
</head>
<body>
<div class="card">
  <h1>⚡ Reaction Time Test</h1>
  <p class="subtitle">Click the green box the moment it appears</p>
  <div id="arena" class="wait" onclick="handleClick()">Click to Start</div>
  <div class="results">
    <div class="res-box"><div class="res-val" id="last">—</div><div class="res-label">Last (ms)</div></div>
    <div class="res-box"><div class="res-val" id="best">—</div><div class="res-label">Best (ms)</div></div>
    <div class="res-box"><div class="res-val" id="avg">—</div><div class="res-label">Avg (ms)</div></div>
  </div>
  <div class="history" id="history"></div>
  <button onclick="resetAll()">Reset Scores</button>
</div>
<a href="../games.html" class="back">← Back to Games</a>

<script>
let state='idle', startTime, timeout, times=[];

function handleClick(){
  if(state==='idle'||state==='done'){
    state='waiting';
    document.getElementById('arena').className='arena wait';
    document.getElementById('arena').textContent='Wait for green...';
    const delay = 1500 + Math.random()*3000;
    timeout = setTimeout(()=>{
      state='ready';
      startTime=Date.now();
      document.getElementById('arena').className='arena ready';
      document.getElementById('arena').textContent='CLICK NOW!';
    }, delay);
  } else if(state==='waiting'){
    clearTimeout(timeout);
    state='done';
    document.getElementById('arena').className='arena clicked-early';
    document.getElementById('arena').textContent='Too early! Click to try again.';
  } else if(state==='ready'){
    const ms = Date.now()-startTime;
    times.push(ms);
    state='done';
    const best=Math.min(...times);
    const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
    document.getElementById('last').textContent=ms;
    document.getElementById('best').textContent=best;
    document.getElementById('avg').textContent=avg;
    const rating = ms<150?'⚡ Superhuman':ms<200?'🏆 Excellent':ms<250?'👍 Good':ms<350?'😊 Average':'🐢 Keep practising';
    document.getElementById('arena').className='arena wait';
    document.getElementById('arena').textContent=`${ms}ms — ${rating}\nClick to go again`;
    const chip=document.createElement('span');
    chip.className='hist-chip';
    chip.textContent=ms+'ms';
    document.getElementById('history').prepend(chip);
  }
}

function resetAll(){
  times=[];state='idle';
  document.getElementById('last').textContent='—';
  document.getElementById('best').textContent='—';
  document.getElementById('avg').textContent='—';
  document.getElementById('history').innerHTML='';
  document.getElementById('arena').className='arena wait';
  document.getElementById('arena').textContent='Click to Start';
}
</script>
</body>
</html>

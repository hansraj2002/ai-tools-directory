<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Guessing Game | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.6rem;font-weight:700;margin-bottom:6px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:14px;color:#64748b;margin-bottom:24px}
.emoji{font-size:3rem;margin-bottom:16px;display:block}
input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:14px;font-size:1.1rem;text-align:center;outline:none;transition:.3s;margin-bottom:12px}
input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.2)}
button{width:100%;padding:13px;border:none;border-radius:14px;background:linear-gradient(90deg,#6366f1,#a78bfa);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:.3s;margin-bottom:8px}
button:hover{transform:translateY(-2px);opacity:.9}
.btn-secondary{background:linear-gradient(90deg,#64748b,#94a3b8)}
.hint{font-size:1.1rem;font-weight:600;padding:12px;border-radius:12px;margin:12px 0;min-height:44px}
.hint.low{background:#fef3c7;color:#d97706}
.hint.high{background:#dbeafe;color:#2563eb}
.hint.win{background:#dcfce7;color:#16a34a}
.hint.lose{background:#fee2e2;color:#dc2626}
.attempts{font-size:13px;color:#94a3b8;margin-top:8px}
.history{margin-top:16px;text-align:left;max-height:120px;overflow-y:auto}
.history-item{font-size:13px;padding:4px 8px;background:#f5f3ff;border-radius:8px;margin-bottom:4px;color:#4f46e5}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
.back:hover{opacity:1}
</style>
</head>
<body>
<div class="card">
  <span class="emoji">🔢</span>
  <h1>AI Guessing Game</h1>
  <p class="subtitle">I'm thinking of a number between 1 and 100</p>
  <input type="number" id="guess" placeholder="Enter your guess..." min="1" max="100" onkeydown="if(event.key==='Enter')checkGuess()">
  <button onclick="checkGuess()">Guess!</button>
  <button class="btn-secondary" onclick="resetGame()">New Game</button>
  <div class="hint" id="hint"></div>
  <div class="attempts" id="attempts"></div>
  <div class="history" id="history"></div>
</div>
<a href="../games.html" class="back">← Back to Games</a>

<script>
let secret, attempts, maxAttempts = 7, gameOver = false;

function resetGame() {
  secret = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  gameOver = false;
  document.getElementById('hint').className = 'hint';
  document.getElementById('hint').textContent = '';
  document.getElementById('attempts').textContent = `You have ${maxAttempts} attempts`;
  document.getElementById('history').innerHTML = '';
  document.getElementById('guess').value = '';
  document.getElementById('guess').disabled = false;
}

function checkGuess() {
  if (gameOver) return;
  const val = parseInt(document.getElementById('guess').value);
  if (!val || val < 1 || val > 100) { alert('Please enter a number between 1 and 100'); return; }
  attempts++;
  const hintEl = document.getElementById('hint');
  const hist = document.getElementById('history');
  hist.innerHTML = `<div class="history-item">Guess ${attempts}: ${val}</div>` + hist.innerHTML;

  if (val === secret) {
    hintEl.className = 'hint win';
    hintEl.textContent = `🎉 Correct! You got it in ${attempts} attempt${attempts>1?'s':''}!`;
    document.getElementById('attempts').textContent = '';
    document.getElementById('guess').disabled = true;
    gameOver = true;
  } else if (attempts >= maxAttempts) {
    hintEl.className = 'hint lose';
    hintEl.textContent = `😢 Game over! The number was ${secret}`;
    document.getElementById('attempts').textContent = '';
    document.getElementById('guess').disabled = true;
    gameOver = true;
  } else if (val < secret) {
    hintEl.className = 'hint low';
    hintEl.textContent = `📈 Too low! Go higher.`;
    document.getElementById('attempts').textContent = `${maxAttempts - attempts} attempt${maxAttempts-attempts!==1?'s':''} remaining`;
  } else {
    hintEl.className = 'hint high';
    hintEl.textContent = `📉 Too high! Go lower.`;
    document.getElementById('attempts').textContent = `${maxAttempts - attempts} attempt${maxAttempts-attempts!==1?'s':''} remaining`;
  }
  document.getElementById('guess').value = '';
}

resetGame();
</script>
</body>
</html>

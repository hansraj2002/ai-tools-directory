<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match | AI Tools Directory</title>
<link rel="icon" href="../favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#6366f1,#a78bfa,#f472b6);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:28px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
h1{font-size:1.5rem;font-weight:700;margin-bottom:16px;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:18px}
.stat{background:#f5f3ff;border-radius:12px;padding:10px 20px;text-align:center}
.stat-val{font-size:1.3rem;font-weight:700;color:#6366f1}
.stat-label{font-size:11px;color:#64748b}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile{aspect-ratio:1;border-radius:12px;cursor:pointer;font-size:1.8rem;display:flex;align-items:center;justify-content:center;background:#e0e7ff;transition:transform .2s;border:none;outline:none}
.tile:hover{transform:scale(1.05)}
.tile.flipped,.tile.matched{background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff}
.tile.matched{background:linear-gradient(135deg,#22c55e,#4ade80);cursor:default}
.tile.hidden{visibility:hidden}
button{padding:11px 24px;border:none;border-radius:12px;background:linear-gradient(90deg,#6366f1,#a78bfa);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.3s}
button:hover{transform:translateY(-2px);opacity:.9}
.win-msg{background:#dcfce7;border-radius:14px;padding:14px;margin-bottom:14px;color:#15803d;font-weight:600;display:none}
.back{display:inline-block;margin-top:20px;color:#fff;text-decoration:none;font-size:14px;opacity:.85}
</style>
</head>
<body>
<div class="card">
  <h1>🃏 Memory Match</h1>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="moves">0</div><div class="stat-label">Moves</div></div>
    <div class="stat"><div class="stat-val" id="pairs">0/8</div><div class="stat-label">Pairs</div></div>
    <div class="stat"><div class="stat-val" id="timer">0s</div><div class="stat-label">Time</div></div>
  </div>
  <div class="win-msg" id="win">🎉 You matched all pairs!</div>
  <div id="grid"></div>
  <button onclick="newGame()">New Game</button>
</div>
<a href="../games.html" class="back">← Back to Games</a>

<script>
const emojis=['🤖','🎨','🎬','🎵','💻','🔬','📈','⚡'];
let cards,flipped=[],moves=0,pairs=0,locked=false,timerInt,seconds=0,started=false;

function newGame(){
  clearInterval(timerInt);
  seconds=0;moves=0;pairs=0;flipped=[];locked=false;started=false;
  document.getElementById('moves').textContent='0';
  document.getElementById('pairs').textContent='0/8';
  document.getElementById('timer').textContent='0s';
  document.getElementById('win').style.display='none';
  cards=[...emojis,...emojis].sort(()=>Math.random()-.5);
  const g=document.getElementById('grid');
  g.innerHTML=cards.map((e,i)=>`<button class="tile" id="t${i}" onclick="flip(${i})" aria-label="Card ${i+1}"></button>`).join('');
}

function flip(i){
  if(locked||flipped.includes(i)||document.getElementById('t'+i).classList.contains('matched'))return;
  if(!started){started=true;timerInt=setInterval(()=>{seconds++;document.getElementById('timer').textContent=seconds+'s';},1000);}
  const el=document.getElementById('t'+i);
  el.textContent=cards[i];
  el.classList.add('flipped');
  flipped.push(i);
  if(flipped.length===2){
    moves++;
    document.getElementById('moves').textContent=moves;
    locked=true;
    const [a,b]=flipped;
    if(cards[a]===cards[b]){
      document.getElementById('t'+a).classList.replace('flipped','matched');
      document.getElementById('t'+b).classList.replace('flipped','matched');
      pairs++;
      document.getElementById('pairs').textContent=pairs+'/8';
      flipped=[];locked=false;
      if(pairs===8){clearInterval(timerInt);document.getElementById('win').style.display='block';}
    } else {
      setTimeout(()=>{
        [a,b].forEach(x=>{const el=document.getElementById('t'+x);el.textContent='';el.classList.remove('flipped');});
        flipped=[];locked=false;
      },900);
    }
  }
}
newGame();
</script>
</body>
</html>
